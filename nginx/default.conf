# =========================================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO LINGUAVAULT (DOCKER)
# =========================================================================

# Khai báo biến nâng cấp WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Cho phép upload file ghi âm / backup dữ liệu lên tới 25MB
    client_max_body_size 25M;

    # Bật nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Hỗ trợ xác thực chứng chỉ SSL tự động của Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển tiếp toàn bộ yêu cầu sang container ứng dụng Node.js (cổng 5001)
    location / {
        proxy_pass http://app:5001;
        proxy_http_version 1.1;

        # WebSocket & Audio stream headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Client info headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts cho AI response (Gemini Flash)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
