name: LinguaVault CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DB_PATH: ${{ runner.temp }}/lingua-vault-test.db
      SCHEDULERS_ENABLED: "false"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run backend tests
        run: node test-all-features.js

  web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build production web
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: lingua-vault-web
          path: web/dist
          retention-days: 7

  mobile:
    name: Validate mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Verify mobile web bundle
        run: npx expo export --platform web --output-dir dist-ci

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [server, web, mobile]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lingua-vault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
