name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install Dependencies
        run: |
          cd mobile
          npm install

      - name: 🛠️ Generate Android Native Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: 🚀 Build Release APK (Gradle)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload LinguaVault.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaVault-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
