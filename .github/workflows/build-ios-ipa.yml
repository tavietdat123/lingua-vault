name: Build iOS IPA (Sideloadly / AltStore)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: 🛠️ Generate Native iOS Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform ios --clean

      - name: 🔨 Install CocoaPods Dependencies
        run: |
          cd mobile/ios
          pod install

      - name: 🚀 Compile Native iOS App (Xcodebuild)
        run: |
          cd mobile
          xcodebuild -workspace ios/LinguaVault.xcworkspace \
            -scheme LinguaVault \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Package into Sideloadable .ipa (Payload)
        run: |
          cd mobile
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LinguaVault.app Payload/
          zip -r LinguaVault.ipa Payload
          ls -la LinguaVault.ipa

      - name: 📤 Upload LinguaVault.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaVault-iOS-IPA
          path: mobile/LinguaVault.ipa
          retention-days: 14
